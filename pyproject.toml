[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-accident-detection"
version = "0.2.0"
description = "Argus: Real-Time Road Accident Detection & Surveillance System"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Argus Contributors" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.17",
    "pyzmq>=26.0.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "pillow>=10.0.0",
    "joblib>=1.3.0",
    "threadpoolctl>=3.0.0",
    "httpx>=0.27.0",
    "torch>=2.0.0",
    "matplotlib>=3.8.0",
    "pygame>=2.5.0",
]

[project.optional-dependencies]
gui = [
    "PyQt5>=5.15.10",
    "PyQt5-sip>=12.13.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "anyio>=4.0.0",
]
all = [
    "argus-accident-detection[gui,test]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["System*", "Mosse_Tracker*", "Car_Detection*", "VIF*", "backend*"]
