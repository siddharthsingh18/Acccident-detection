<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Polygon -->
  <polygon points="32,4 58,16 58,38 32,60 6,38 6,16" fill="#090d16" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glow)" />

  <!-- Inner Surveillance Aperture / Argus Eye -->
  <path d="M14,32 C20,20 44,20 50,32 C44,44 20,44 14,32 Z" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
  
  <!-- Iris -->
  <circle cx="32" cy="32" r="7" fill="url(#cyanGrad)" />
  
  <!-- Critical Red Pupil / Sensor Core -->
  <circle cx="32" cy="32" r="3.5" fill="#ef4444" />
</svg>